name: Build Recorddy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release (ej. v0.4.0); dejar vacío para solo compilar'
        required: false
        type: string
      publish:
        description: 'Crear o actualizar un release en borrador'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Conserva el nombre del job por compatibilidad con posibles reglas de protección de main.
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Comprobar Recorddy
        run: cargo check --locked
      - name: Comprobar Recorddy con devtools
        run: cargo check --locked --features devtools

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Comprobar parámetros de publicación
        if: inputs.publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw 'Para publicar, especifica un tag válido, por ejemplo v0.4.0'
          }

      - name: Compilar Recorddy (Release)
        run: cargo build --release --locked

      - name: Preparar paquete portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Recorddy | Out-Null
          Copy-Item target/release/recorddy.exe dist/Recorddy/Recorddy.exe
          Copy-Item LICENSE dist/Recorddy/LICENSE
          if (Test-Path NOTICE.md) { Copy-Item NOTICE.md dist/Recorddy/NOTICE.md }
          if (Test-Path README.md) { Copy-Item README.md dist/Recorddy/README.md }
          Compress-Archive -Path dist/Recorddy/* -DestinationPath dist/Recorddy-Windows-x64.zip -Force
          Write-Host "Tamaño del ejecutable:" (Get-Item dist/Recorddy/Recorddy.exe).Length "bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: Recorddy-Windows-x64
          path: dist/Recorddy-Windows-x64.zip
          if-no-files-found: error

      # Publicación exclusivamente manual. No añade actualizaciones a la app.
      - name: Crear o actualizar release en borrador
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            $release = gh release view "$env:RELEASE_TAG" --json isDraft | ConvertFrom-Json
            if (-not $release.isDraft) { throw 'El release ya está publicado; no se sobrescribirá automáticamente.' }
            gh release upload "$env:RELEASE_TAG" dist/Recorddy-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" dist/Recorddy-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Recorddy $env:RELEASE_TAG" --notes 'Versión de Recorddy (fork modificado de Clippy). Código fuente disponible en el repositorio, bajo GPL-3.0-or-later.' --draft
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear o actualizar el release.' }
